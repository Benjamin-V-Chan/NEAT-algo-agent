[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neat-racer"
version = "0.1.0"
description = "NEAT-driven autonomous car racing research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NEAT Racer Contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "neat-python>=0.92",
  "pygame>=2.6"
]

[project.optional-dependencies]
parquet = ["pyarrow>=15.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
neat-racer = "neat_racer.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["neat_racer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
